<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INF - INFINITY | Lixa AI Trading Assistant</title>
    <!-- خطوط جوجل العربية والإنجليزية بتصميم فاخر -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(13, 20, 38, 0.7);
            --primary-blue: #0066ff;
            --neon-blue: #00d9ff;
            --accent-glow: rgba(0, 217, 255, 0.25);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(0, 217, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 102, 255, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 85% 90%, rgba(0, 217, 255, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Header Area */
        header {
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img-container {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* إطار الصورة الخاصة بك */
        .logo-img-container img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            object-fit: contain;
        }

        /* صورة بديلة مؤقتة في حال عدم رفع صورتك بعد */
        .logo-placeholder {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,217,255,0.2) 0%, transparent 70%);
            border: 1px solid var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #ffffff 0%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.4);
            line-height: 1;
        }

        .brand-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 12px;
            color: var(--neon-blue);
            text-transform: uppercase;
            margin-top: 5px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Chat Container */
        .chat-wrapper {
            width: 90%;
            max-width: 900px;
            height: 60vh;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 2px rgba(0, 217, 255, 0.3);
            display: flex;
            flex-direction: column;
            margin: 20px 0;
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Messages Styling */
        .message {
            display: flex;
            gap: 15px;
            max-width: 85%;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.lixa {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .lixa .avatar {
            background: linear-gradient(135deg, var(--primary-blue), var(--neon-blue));
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .user .avatar {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .msg-content {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            position: relative;
        }

        .lixa .msg-content {
            border-top-right-radius: 2px;
            border-color: rgba(0, 217, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .user .msg-content {
            border-top-left-radius: 2px;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.2), rgba(15, 23, 42, 0.9));
            border-color: rgba(0, 102, 255, 0.3);
        }

        .msg-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--neon-blue);
            letter-spacing: 1px;
        }

        .user .msg-header {
            color: #60a5fa;
            text-align: left;
        }

        /* Upload & Input Bar */
        .input-bar {
            padding: 15px 20px;
            background: rgba(8, 12, 24, 0.9);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-upload-btn {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(0, 217, 255, 0.05);
            border: 1px dashed var(--neon-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .file-upload-btn:hover {
            background: rgba(0, 217, 255, 0.15);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .file-upload-btn input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--neon-blue);
        }

        .text-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary-blue), var(--neon-blue));
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.5);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            transform: rotate(-90deg);
        }

        /* Image Preview Badge */
        #image-preview {
            display: none;
            padding: 5px 10px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 15px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .copyright {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .copyright:hover {
            opacity: 1;
            color: var(--neon-blue);
        }
    </style>
</head>
<body>

    <!-- الهيدر والعناوين -->
    <header>
        <div class="logo-img-container">
            <!-- يمكنك إستبدال الرابط أدناه برابط صورتك الخاصة بالإنفنتي الأزرق -->
            <div class="logo-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#00d9ff" stroke-width="2">
                    <path d="M12 12c-2-2.5-4-4-6-4s-4 1.5-4 4 2 4 4 4 4-1.5 6-4zm0 0c2 2.5 4 4 6 4s4-1.5 4-4-2-4-4-4-4 1.5-6 4z"/>
                </svg>
            </div>
        </div>
        <h1 class="brand-title">INF</h1>
        <div class="brand-subtitle">INFINITY</div>
    </header>

    <!-- منطقة الشات -->
    <div class="chat-wrapper">
        <div class="chat-box" id="chatBox">
            <!-- رسالة الترحيب من ليكسا -->
            <div class="message lixa">
                <div class="avatar">LX</div>
                <div class="msg-content">
                    <div class="msg-header">LIXA AI</div>
                    أهلاً بك. أنا **Lixa**، مساعدتك الذكية لإدارة وتقييم صفقات التداول بناءً على قواعد رينجات فيبوناتشي الخاصة بك. ارفع صورة الشارت وسأقوم بمراجعتها معك خطوة بخطوة.
                </div>
            </div>
        </div>

        <!-- معاينة الصورة عند رفعها -->
        <div style="padding: 0 20px;">
            <span id="image-preview">تم إرفاق صورة الشارت ✓</span>
        </div>

        <!-- بار الإدخال ورفع الصورة -->
        <div class="input-bar">
            <div class="file-upload-btn" title="رفع صورة الشارت">
                <input type="file" id="chartInput" accept="image/*" onchange="previewImage(event)">
                <svg viewBox="0 0 24 24">
                    <path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/>
                </svg>
            </div>
            <input type="text" id="userInput" class="text-input" placeholder="اكتب ملاحظاتك عن الشارت هنا..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- الفوتر مع الحقوق والتاريخ -->
    <footer>
        <div class="copyright">
            INFINITY ©® 2026
        </div>
    </footer>

    <script>
        // دالة إظهار اسم الصورة المرفوعة
        function previewImage(event) {
            const preview = document.getElementById('image-preview');
            if (event.target.files && event.target.files[0]) {
                preview.style.display = 'inline-block';
                preview.innerText = 'تم إرفاق: ' + event.target.files[0].name;
            }
        }

        // إرسال الرسالة
        function sendMessage() {
            const textInput = document.getElementById('userInput');
            const fileInput = document.getElementById('chartInput');
            const chatBox = document.getElementById('chatBox');
            const preview = document.getElementById('image-preview');

            if (textInput.value.trim() === '' && fileInput.files.length === 0) return;

            // إدراج رسالة المستخدم
            const userMsgHtml = `
                <div class="message user">
                    <div class="avatar">YOU</div>
                    <div class="msg-content">
                        <div class="msg-header">TRADER</div>
                        ${fileInput.files.length > 0 ? '<div style="color: var(--neon-blue); margin-bottom:5px;">📷 [تم إرسال صورة الشارت]</div>' : ''}
                        ${textInput.value}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userMsgHtml);

            // تفريغ المدخلات
            const userText = textInput.value;
            textInput.value = '';
            fileInput.value = '';
            preview.style.display = 'none';

            chatBox.scrollTop = chatBox.scrollHeight;

            // استجابة وهمية مؤقتة من ليكسا للاختبار
            setTimeout(() => {
                const lixaResponseHtml = `
                    <div class="message lixa">
                        <div class="avatar">LX</div>
                        <div class="msg-content">
                            <div class="msg-header">LIXA AI</div>
                            تم استلام المعطيات. جاري مطابقة الشارت مع شروط الرينج ومستويات الفيبوناتشي المحددة...
                        </div>
                    </div>
                `;
                chatBox.insertAdjacentHTML('beforeend', lixaResponseHtml);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
